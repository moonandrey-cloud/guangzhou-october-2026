<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Китайский до Гуанчжоу</title>
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#f4f1ea">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Китайский">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon-192.png">
  <style>
    :root {
      --bg: #f4f1ea;
      --ink: #1a1714;
      --muted: #5c564c;
      --card: #fffdf8;
      --line: #e4ddd2;
      --accent: #9a3b2f;
      --accent-soft: #f3e2dd;
      --memo: #f7efe3;
      --ok: #2f6b3a;
      --ok-soft: #e7efe4;
      --zh: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    header, main { max-width: 44rem; margin: 0 auto; padding: 0 1rem; }
    header { padding-top: calc(.9rem + env(safe-area-inset-top)); display: flex; justify-content: space-between; align-items: baseline; gap: 1rem; }
    header h1 { font-size: 1.2rem; margin: 0; }
    header .sub { margin: 0; color: var(--muted); font-size: .9rem; }
    main { padding-bottom: 3rem; }
    .zh, .hz, .part .zw, .cube .zw { font-family: var(--zh); }

    nav.tabs {
      position: sticky; top: 0; z-index: 20;
      display: flex; gap: .35rem; overflow-x: auto; scrollbar-width: none;
      max-width: 44rem; margin: .6rem auto 0; padding: .45rem 1rem;
      background: linear-gradient(var(--bg) 85%, transparent);
    }
    nav.tabs::-webkit-scrollbar { display: none; }
    nav.tabs button {
      flex: 0 0 auto; border: 1px solid var(--line); background: var(--card); color: var(--ink);
      border-radius: 999px; padding: .5rem .95rem; min-height: 44px; font: inherit; font-size: .95rem; cursor: pointer;
    }
    nav.tabs button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
    nav.tabs button .n { display: inline-block; min-width: 1.3em; margin-left: .3em; padding: 0 .35em; border-radius: 999px; background: #fff; color: var(--accent); font-size: .75rem; font-weight: 700; line-height: 1.4; text-align: center; }
    nav.tabs button:not(.on) .n { background: var(--accent-soft); }
    nav.tabs button svg { display: none; width: 22px; height: 22px; }

    @media (max-width: 640px) {
      nav.tabs {
        position: fixed; top: auto; bottom: 0; left: 0; right: 0; max-width: none; margin: 0;
        padding: .3rem .3rem calc(.3rem + env(safe-area-inset-bottom));
        background: var(--card); border-top: 1px solid var(--line); gap: .2rem; justify-content: space-between;
      }
      nav.tabs button { position: relative; flex: 1 1 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: .35rem .1rem .3rem; font-size: .68rem; border-radius: 10px; min-height: 52px; border-color: transparent; }
      nav.tabs button svg { display: block; }
      nav.tabs button .n { position: absolute; top: 2px; right: 8%; margin: 0; }
      main { padding-bottom: calc(5.6rem + env(safe-area-inset-bottom)); }
    }

    .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; margin: .5rem 0; }
    .tile {
      border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 14px;
      padding: .65rem .7rem; text-align: left; font: inherit; cursor: pointer; min-height: 5.4rem;
      display: flex; flex-direction: column; justify-content: space-between; gap: .25rem;
    }
    .tile .zh { font-size: 1.35rem; line-height: 1.2; }
    .tile .ru { font-size: .82rem; color: var(--muted); line-height: 1.25; }
    .tile.sos { background: var(--accent); color: #fff; border-color: var(--accent); }
    .tile.sos .ru { color: #f3e2dd; }
    .tile.wide { grid-column: 1 / -1; min-height: 0; }
    .tile.wide .zh { font-size: 1.6rem; }

    .frames { display: flex; gap: .35rem; overflow-x: auto; padding: .2rem 0 .4rem; scrollbar-width: none; }
    .frames::-webkit-scrollbar { display: none; }
    .frames button { flex: 0 0 auto; min-height: 40px; padding: .3rem .8rem; font-size: .92rem; }
    .frames button .zw { font-family: var(--zh); margin-right: .3em; }
    .fill { display: grid; grid-template-columns: repeat(auto-fill, minmax(6.6rem, 1fr)); gap: .4rem; margin-top: .5rem; }
    .fill button { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: .45rem .3rem; font: inherit; cursor: pointer; text-align: center; color: var(--ink); }
    .fill button.on { background: var(--accent-soft); border-color: var(--accent); }
    .fill button .zw { font-family: var(--zh); font-size: 1.25rem; display: block; line-height: 1.2; }
    .fill button .d { color: var(--muted); font-size: .78rem; display: block; line-height: 1.2; }
    .built .zh { font-size: 2.1rem; line-height: 1.2; }
    .built .say { font-size: 1.15rem; font-weight: 650; margin-top: .15rem; }
    .built .ru { color: var(--muted); }

    .show .top { position: absolute; top: calc(1rem + env(safe-area-inset-top)); left: 1rem; right: 7rem; text-align: left; font-size: .9rem; color: var(--muted); font-family: var(--zh); line-height: 1.3; }
    .show .ans { display: flex; gap: .4rem; flex-wrap: wrap; justify-content: center; margin-top: .4rem; }
    .show .ans button { border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: .45rem .6rem; font: inherit; color: var(--ink); min-width: 4.6rem; cursor: pointer; }
    .show .ans button .zw { font-family: var(--zh); font-size: 1.5rem; display: block; line-height: 1.2; }
    .show .ans button .s { font-size: .82rem; font-weight: 650; display: block; line-height: 1.25; }
    .show .ans button .d { font-size: .72rem; color: var(--muted); display: block; }
    .show .ans button.on { background: var(--ok-soft); border-color: var(--ok); }
    .show .got { margin-top: .4rem; font-size: 1.15rem; color: var(--ok); font-weight: 650; min-height: 1.6rem; }
    @media (max-width: 640px) {
      .show .ans { display: grid; grid-template-columns: repeat(4, 1fr); width: 100%; }
      .show .ans button { min-width: 0; padding: .45rem .2rem; }
    }
    .install { display: flex; gap: .7rem; align-items: flex-start; }
    .install .x { margin-left: auto; min-height: 36px; padding: .2rem .6rem; }
    .paste textarea { width: 100%; min-height: 3.2rem; resize: vertical; font: inherit; font-size: 1rem; padding: .5rem .8rem; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink); font-family: var(--zh); }

    .btn {
      border: 1px solid var(--line); background: var(--card); color: var(--ink);
      border-radius: 999px; padding: .45rem .9rem; min-height: 44px; font: inherit; cursor: pointer;
    }
    .btn.primary, .btn.on { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn.ok { background: var(--ok); color: #fff; border-color: var(--ok); }
    .btn.soft { background: var(--accent-soft); border-color: var(--accent-soft); }
    .btn.big { padding: .9rem 1.2rem; font-size: 1.05rem; }
    .btn:disabled { opacity: .5; cursor: default; }
    .row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
    .row.between { justify-content: space-between; }
    .btns { display: flex; gap: .4rem; flex-wrap: wrap; }

    .card, .item {
      background: var(--card); border: 1px solid var(--line); border-radius: 14px;
      padding: .95rem 1rem; margin: .7rem 0;
    }
    .card h2 { font-size: 1.05rem; margin: 0 0 .4rem; }
    .card p { margin: .4rem 0; }
    h2.sec { font-size: .8rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 1.4rem 0 .3rem; }
    .muted { color: var(--muted); }
    .small { font-size: .85rem; }
    .hidden { display: none !important; }
    .tag { font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }

    .item .head { display: flex; justify-content: space-between; align-items: flex-start; gap: .6rem; }
    .item .zh { font-size: 2rem; line-height: 1.2; }
    .item .say { font-size: 1.2rem; font-weight: 650; margin-top: .15rem; }
    .item .ru { margin-top: .05rem; }
    .item .py { color: var(--muted); font-size: .85rem; margin-top: .1rem; }
    .item img { width: 100%; border-radius: 10px; margin-top: .7rem; display: block; background: #eee; aspect-ratio: 4/3; object-fit: cover; }
    .memo {
      background: var(--memo); border-left: 3px solid var(--accent);
      padding: .55rem .8rem; margin-top: .7rem; border-radius: 0 10px 10px 0;
    }
    .memo .hook { font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: .15rem; }
    .chars { display: flex; flex-wrap: wrap; gap: .3rem .8rem; color: var(--muted); margin-top: .35rem; font-size: .92rem; }
    .chars b { color: var(--ink); font-family: var(--zh); }
    .cubes { display: flex; flex-wrap: wrap; gap: .45rem; margin-top: .6rem; align-items: stretch; }
    .cube {
      background: var(--memo); border: 1px solid var(--line); border-radius: 10px;
      padding: .4rem .6rem; min-width: 4.6rem; text-align: center;
    }
    .cube .zw { font-size: 1.35rem; line-height: 1.2; }
    .cube .ps { font-weight: 650; }
    .cube .pr { color: var(--muted); font-size: .85rem; }
    .cube.plus { background: none; border: none; min-width: 0; padding: .4rem .1rem; align-self: center; color: var(--muted); }
    details.syl { margin-top: .6rem; }
    details.syl summary { cursor: pointer; color: var(--muted); font-size: .9rem; }
    details.syl .box { margin-top: .4rem; padding: .6rem .8rem; background: #eef2ea; border-radius: 10px; }
    details.syl ol { margin: .2rem 0 0; padding-left: 1.2rem; }
    details.syl li { margin: .3rem 0; }
    .check { margin-top: .65rem; padding: .65rem .8rem; border-radius: 10px; }
    .check p { margin: .35rem 0 0; }
    .check.yes { background: var(--ok-soft); }
    .check.mid { background: #f7f0d8; }
    .check.no { background: #f6e4e0; }
    .check.wait { background: var(--memo); }
    .check.ear { background: #e8eef4; }
    .check .cmp { margin-top: .55rem; }
    .screen { font-size: .85rem; color: var(--muted); margin-top: .35rem; }

    .day {
      display: block; width: 100%; text-align: left; border-radius: 12px; margin: .4rem 0;
      padding: .7rem .9rem; min-height: 52px; border: 1px solid var(--line); background: var(--card); font: inherit; color: var(--ink); cursor: pointer;
    }
    .day .when { font-weight: 650; }
    .day .what { margin-top: .1rem; }
    .day.now { background: var(--accent); color: #fff; border-color: var(--accent); }
    .day.now .muted { color: #f3e2dd; }
    .day.past { color: var(--muted); }
    .day.china { border-left: 4px solid var(--ok); }

    .plan { counter-reset: st; padding-left: 0; list-style: none; margin: .3rem 0 0; }
    .plan li { position: relative; padding: .3rem 0 .3rem 2rem; }
    .plan li::before { counter-increment: st; content: counter(st); position: absolute; left: 0; top: .25rem; width: 1.45rem; height: 1.45rem; border-radius: 50%; background: var(--accent); color: #fff; font-size: .8rem; font-weight: 700; display: flex; align-items: center; justify-content: center; }

    .search { display: flex; gap: .5rem; margin: .5rem 0; }
    .search input, .field {
      flex: 1; min-height: 46px; font: inherit; font-size: 1rem; padding: .5rem .8rem;
      border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink);
    }
    .chips { display: flex; gap: .35rem; overflow-x: auto; padding: .2rem 0 .4rem; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chips button { flex: 0 0 auto; min-height: 38px; padding: .3rem .8rem; font-size: .9rem; }
    .brow {
      display: grid; grid-template-columns: 1fr auto; gap: .2rem .6rem; align-items: center;
      background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: .6rem .8rem; margin: .4rem 0; cursor: pointer;
    }
    .brow .zh { font-size: 1.45rem; line-height: 1.2; }
    .brow .say { font-weight: 650; }
    .brow .ru { color: var(--muted); font-size: .92rem; }
    .brow .btns { grid-row: 1 / span 3; }
    .brow .btns .btn { min-height: 40px; padding: .35rem .7rem; }
    .brow.open { grid-template-columns: 1fr; }
    .brow.open .btns { grid-row: auto; }

    .show {
      position: fixed; inset: 0; z-index: 60; background: #fffdf8; color: var(--ink);
      display: flex; flex-direction: column; align-items: stretch; text-align: center; overflow-y: auto;
      padding: calc(3.6rem + env(safe-area-inset-top)) 1.2rem calc(1.2rem + env(safe-area-inset-bottom));
    }
    .show .mid { margin: auto 0; display: flex; flex-direction: column; align-items: center; gap: .6rem; }
    .show .hz { font-size: clamp(2.4rem, var(--hz, 15vw), 8rem); line-height: 1.15; overflow-wrap: anywhere; }
    .show .py { font-size: 1.3rem; color: var(--muted); }
    .show .ru { font-size: 1.1rem; }
    .show .close { position: absolute; top: calc(.8rem + env(safe-area-inset-top)); right: .8rem; }
    .show .hint { color: var(--muted); font-size: .85rem; margin-top: 1rem; }

    .live .mic { width: 100%; padding: 1.1rem; font-size: 1.15rem; border-radius: 16px; }
    .live .heard { font-size: 1.9rem; line-height: 1.25; margin-top: .4rem; min-height: 2.5rem; }
    .live .gl { display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .5rem; }
    .live .gl span { background: var(--memo); border-radius: 8px; padding: .25rem .5rem; font-size: .9rem; }
    .live .gl span b { font-family: var(--zh); font-size: 1.1rem; display: block; }
    .live .tr { margin-top: .5rem; font-size: 1.15rem; }
    .live .price { margin-top: .5rem; font-size: 1.6rem; font-weight: 700; color: var(--ok); }
    .live .hist { margin-top: .5rem; }
    .live .hist .h { padding: .45rem 0; border-top: 1px solid var(--line); }
    .live .hist .h .zh { font-size: 1.25rem; }

    .flash { min-height: 12rem; display: flex; flex-direction: column; justify-content: center; gap: .45rem; }
    .flash .big { font-size: 1.8rem; }
    .grade { display: flex; gap: .5rem; margin: .5rem 0; }
    .grade .btn { flex: 1; }
    .prog { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin: .4rem 0; }
    .prog i { display: block; height: 100%; background: var(--ok); }

    .tones { width: 100%; height: 90px; margin: .5rem 0; }
    .num { display: grid; grid-template-columns: repeat(auto-fill, minmax(5.2rem, 1fr)); gap: .4rem; margin-top: .5rem; }
    .num button { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: .5rem .3rem; font: inherit; cursor: pointer; text-align: center; }
    .num button .zw { font-family: var(--zh); font-size: 1.4rem; display: block; }
    .num button .ps { font-weight: 650; font-size: .9rem; display: block; }
    .num button .d { color: var(--muted); font-size: .8rem; }
    .conv { display: flex; gap: .5rem; align-items: center; margin-top: .5rem; }
    .conv input { width: 7rem; }
    .conv .out { font-size: 1.4rem; }
    .conv .out .zw { font-family: var(--zh); font-size: 1.8rem; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Китайский до Гуанчжоу</h1>
      <p class="sub" id="sub"></p>
    </div>
  </header>
  <nav class="tabs" id="tabs">
    <button data-tab="today" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Сегодня</button>
    <button data-tab="cal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>Уроки</button>
    <button data-tab="book"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>Фразы</button>
    <button data-tab="live"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>Живой</button>
    <button data-tab="cards"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="13" height="14" rx="2"/><path d="M8 4h11a2 2 0 0 1 2 2v11"/></svg>Карты<span class="n" id="due-n"></span></button>
    <button data-tab="how"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6"/></svg>Рот</button>
  </nav>
  <main>
    <section id="tab-today"></section>
    <section id="tab-cal" class="hidden"></section>
    <section id="tab-book" class="hidden"></section>
    <section id="tab-live" class="hidden"></section>
    <section id="tab-cards" class="hidden"></section>
    <section id="tab-how" class="hidden"></section>
  </main>
  <div id="overlay"></div>

<script id="data">
// kind:"w" — слово: один звук, одна картинка-крючок. parts — фраза из слов.
const P = {
  ma1:{kind:"w",ru:"мама", py:"mā", zh:"妈", say:"ма",
    memo:"Ровный высокий «мааа», как мама тянет ноту. Первый тон = держать ноту."},
  ma2:{kind:"w",ru:"онемело", py:"má", zh:"麻", say:"ма",
    memo:"«Ма?!» вверх, как нога онемела. Второй тон = удивлённое «да?!»."},
  ma3:{kind:"w",ru:"лошадь", py:"mǎ", zh:"马", say:"ма",
    memo:"Лошадь кивает: вниз и чуть вверх. Третий тон. В речи часто просто низкий."},
  ma4:{kind:"w",ru:"ругать", py:"mà", zh:"骂", say:"ма",
    memo:"«Ма!» как короткое «нет!». Четвёртый тон = резко вниз."},

  nihao:{kind:"w",ru:"привет", py:"nǐ hǎo", zh:"你好", say:"ни хао", img:"memo/memo-nihao.jpg",
    memo:"НИщий ХАвает у дверей и орёт «привет». НИ-ХАО = привет."},
  xiexie:{kind:"w",ru:"спасибо", py:"xièxie", zh:"谢谢", say:"се-се", img:"memo/memo-xiexie.jpg",
    memo:"Две СЕстры кланяются разом. СЕ-СЕ = спасибо. x — мягкое «сь», не «кс»."},
  duibuqi:{kind:"w",ru:"извините", py:"duìbuqǐ", zh:"对不起", say:"дуй-бу-ци", img:"memo/memo-duibuqi.jpg",
    memo:"ДУЙнул так, что БУтылка и ЦИстерна упали. Извиняется. ДУЙ-БУ-ЦИ."},
  haode:{kind:"w",ru:"хорошо, ладно", py:"hǎo de", zh:"好的", say:"хао дэ", img:"memo/memo-haode.jpg",
    memo:"В ХАОСе мужик поднимает палец: «ДЭ, ладно». ХАО-ДЭ = ок."},

  wni:{kind:"w",ru:"ты", py:"nǐ", zh:"你", say:"ни", img:"memo/w-ni-2.jpg",
    memo:"НИщий тычет в вас пальцем. НИ = ты."},
  wwo:{kind:"w",ru:"я", py:"wǒ", zh:"我", say:"во", img:"memo/w-wo-2.jpg",
    memo:"ВОрона тычет крылом себе в грудь. ВО = я."},
  wai:{kind:"w",ru:"любить, любовь", py:"ài", zh:"爱", say:"ай", img:"memo/w-ai-2.jpg",
    memo:"АИст несёт сердце. АЙ = любить."},
  wtin:{kind:"w",ru:"слышать", py:"tīng", zh:"听", say:"тин", img:"memo/w-tin-2.jpg",
    memo:"Жестянка ТИНЬкает в ухе. ТИН = слышать."},
  wbu:{kind:"w",ru:"не", py:"bù", zh:"不", say:"бу", img:"memo/w-bu-3.jpg",
    memo:"БУльдог в дверях качает головой. БУ = не. Всегда перед глаголом."},
  wdong:{kind:"w",ru:"понимать", py:"dǒng", zh:"懂", say:"дун", img:"memo/w-dong-2.jpg",
    memo:"Колокол ДУН — и дошло. ДУН = понимать."},

// Признанные варианты записи для проверки речи
const ALIAS = {
  nihao:["你好","您好"], haode:["好的","好"], duibuqi:["对不起","抱歉","不好意思"],
  slow:["请说慢一点","请说慢一点儿","说慢一点"], eng:["你会说英语吗","会说英语吗","你会英语吗"],
  woqu:["我要去","我去"], nali:["在哪里","在哪儿","哪里"], wnali:["哪里","哪儿"], wzher:["这儿","这里"],
  keyi:["可以吗","可以"], youmei:["有没有","有没"], wc:["洗手间在哪里","洗手间在哪儿","卫生间在哪里"],
  yidianla:["一点辣","一点点辣"], ting:["到这儿停","到这里停","这儿停"], milu:["我迷路了","迷路了"],
  bang:["帮帮我","帮我"], n2:["二","两"], reshui:["热水","热的水"], zuo:["左边","左"], you:["右边","右"],
  ma1:["妈","妈妈"], ma2:["麻"], ma3:["马"], ma4:["骂"]

<script>
// ---------- утилиты ----------
const $ = (s) => document.querySelector(s);
const isSafari = /^((?!chrome|android).)*safari/i.test(navigator.userAgent);
const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent);
const onGithub = /\.github\.io$/i.test(location.hostname);
function stripZh(s) { return (s || "").replace(/[…。？！，、.?!,\s·]/g, ""); }
function displaySay(s) { return (s || "").replace(/([а-яё]+)( +)(?=[а-яё])/gi, "$1-"); }
function esc(s) { return String(s || "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function isoToday() {
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
const WD = ["вс","пн","вт","ср","чт","пт","сб"];
const MO = ["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];
function fmt(iso) {
  const p = iso.split("-").map(Number);
  const dt = new Date(p[0], p[1]-1, p[2]);
  return `${p[2]} ${MO[p[1]-1]}, ${WD[dt.getDay()]}`;
}
function addDays(iso, n) {
  const p = iso.split("-").map(Number);
  const dt = new Date(p[0], p[1]-1, p[2] + n);
  return dt.getFullYear() + "-" + String(dt.getMonth()+1).padStart(2,"0") + "-" + String(dt.getDate()).padStart(2,"0");
}

// тон из пиньиня: 1 ровно, 2 вверх, 3 низко, 4 вниз, 0 лениво
const TONE_MARKS = { "āēīōūǖ":1, "áéíóúǘ":2, "ǎěǐǒǔǚ":3, "àèìòùǜ":4 };
const TONE_TXT = { 1:"ровно высоко", 2:"вверх", 3:"низко, чуть вверх", 4:"вниз", 0:"лениво, без тона" };
function toneOf(syl) {
  for (const ch of syl) for (const k in TONE_MARKS) if (k.includes(ch)) return TONE_MARKS[k];
  return 0;
}
function pySyllables(py) {
  // делим по пробелам, потом внутри слова — по гласной с тоном
  const out = [];
  (py || "").replace(/[？?…]/g, "").split(/[\s-]+/).filter(Boolean).forEach(word => {
    const re = /[bpmfdtnlgkhjqxzcsrwyZCS]*h?[aeiouüāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ]+(?:ng|n|r)?/gi;
    const m = word.match(re);
    if (m && m.join("").length >= word.length - 1) out.push(...m); else out.push(word);
  });
  return out;
}
function autoSyl(p) {
  const pys = pySyllables(p.py);
  const says = displaySay(p.say).split("-").filter(Boolean);
  if (!pys.length) return null;
  const steps = pys.map((s, i) => ({ s: says[i] || s, go: TONE_TXT[toneOf(s)], how: "" }));
  return { steps, end: steps.length === 1 ? "Один слог." : `${steps.length} удара, каждый со своим тоном.` };
}

// ---------- звук ----------
const AUDIO = {
  ma1:"audio/ma1.m4a", ma2:"audio/ma2.m4a", ma3:"audio/ma3.m4a", ma4:"audio/ma4.m4a", nihao:"audio/nihao.m4a",
  xi:"audio/xi.m4a", qu0:"audio/qu.m4a", ji:"audio/ji.m4a", zhe:"audio/zhe.m4a", chi:"audio/chi.m4a",
  shi:"audio/shi.m4a", ren:"audio/ren.m4a", cai:"audio/cai.m4a", zi:"audio/zi.m4a", nv:"audio/nv.m4a",
  hao:"audio/hao.m4a", wo:"audio/wo.m4a"
};
let player = null;
function speak(zh, rate) {
  if (!window.speechSynthesis) return false;
  const text = (zh || "").replace(/[…]/g, "");
  const go = () => {
    try { speechSynthesis.cancel(); } catch (e) {}
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "zh-CN"; u.rate = rate || 0.8;
    const voices = speechSynthesis.getVoices() || [];
    const v = voices.find(x => /zh[-_]CN/i.test(x.lang)) || voices.find(x => /^zh/i.test(x.lang));
    if (v) u.voice = v;
    setTimeout(() => { try { speechSynthesis.resume(); } catch (e) {} speechSynthesis.speak(u); }, 40);
  };
  if (!(speechSynthesis.getVoices() || []).length) speechSynthesis.addEventListener("voiceschanged", go, { once: true });
  go();
  return true;
}
function playSrc(src, onFail, onEnd) {
  if (player) { player.pause(); player.onended = null; player.onerror = null; }
  player = new Audio(src);
  player.onended = () => { if (onEnd) onEnd(); };
  player.onerror = () => { if (onFail) onFail(); };
  const pr = player.play();
  if (pr && pr.catch) pr.catch(() => { if (onFail) onFail(); });
}
function markBtn(sel, on) { document.querySelectorAll(sel).forEach(b => b.classList.toggle("on", on)); }
function builtById(id) { const m = /^b-([a-z]+)-(.+)$/.exec(id || ""); return m ? buildPhrase(m[1], m[2]) : null; }
function playId(id, onEnd) {
  const p = P[id] || builtById(id); if (!p) return;
  markBtn('button[data-play="'+id+'"]', true);
  const done = () => { markBtn('button[data-play="'+id+'"]', false); if (onEnd) onEnd(); };
  const viaSpeak = () => { speak(p.zh); setTimeout(done, 1500 + 350 * stripZh(p.zh).length); };
  const viaTts = () => playSrc("audio/tts/" + id + ".m4a", viaSpeak, done);
  if (AUDIO[id]) playSrc(AUDIO[id], viaTts, done); else viaTts();
}
function playIds(ids) {
  let i = 0;
  const next = () => { if (i >= ids.length) return; playId(ids[i++], () => setTimeout(next, 450)); };
  next();
}
function playFile(key) { if (AUDIO[key]) playSrc(AUDIO[key]); }
function playZh(zh) {
  // произвольный текст: сначала файл известного слова, потом синтез
  const hit = Object.keys(P).find(id => stripZh(P[id].zh) === stripZh(zh));
  if (hit) playId(hit); else speak(zh);
}

// ---------- прогресс (лёгкий интервальный повтор) ----------
const PROG = JSON.parse(localStorage.getItem("zh-prog") || "{}");
const GAPS = [1, 2, 4, 8, 16];
function saveProg() { localStorage.setItem("zh-prog", JSON.stringify(PROG)); }
function grade(id, ok) {
  const cur = PROG[id] || { box: 0 };
  const box = ok ? Math.min(cur.box + 1, GAPS.length - 1) : 0;
  PROG[id] = { box, due: addDays(isoToday(), ok ? GAPS[box] : 1), seen: isoToday() };
  saveProg(); paintDue();
}
function dueIds() {
  const t = isoToday();
  return Object.keys(PROG).filter(id => P[id] && PROG[id].due <= t);
}
function paintDue() {
  const n = dueIds().length;
  const el = $("#due-n"); if (el) { el.textContent = n ? n : ""; el.classList.toggle("hidden", !n); }
}

// ---------- расписание ----------
function schedule() {
  return [
    ...LESSONS.map(l => ({ iso: l.iso, title: "Урок " + l.id + ". " + l.title, blocks: l.blocks, ids: l.blocks.flatMap(b => b.ids), note: l.can, gram: l.gram, kind: "home", price: !!l.price })),
    ...CHINA.map(d => ({ iso: d.iso, title: d.title, blocks: [{ title: "Сегодня вслух", ids: d.ids }], ids: d.ids, note: d.task, kind: "china" }))
  ].sort((a, b) => a.iso.localeCompare(b.iso));
}
function nextAfter(iso) { return schedule().find(d => d.iso > iso); }
function dayFor(iso) {
  const S = schedule();
  const exact = S.find(d => d.iso === iso);
  if (exact) return { ...exact, mode: "lesson" };
  if (iso < S[0].iso) return { ...S[0], mode: "before" };
  if (iso > S[S.length-1].iso) return { ...S[S.length-1], mode: "after" };
  const past = [...S].reverse().find(d => d.iso <= iso);
  return { ...past, mode: "rest" };
}

// ---------- карточки слов и фраз ----------
function charsLine(zh) {
  const chars = [...stripZh(zh)].filter(ch => /[\u4e00-\u9fff]/.test(ch));
  if (chars.length < 2) return "";
  return `<div class="chars">${chars.map(ch => {
    const r = LEX[ch]; return `<span><b>${ch}</b> — ${r ? esc(r[0]) + " — " + esc(r[1]) : "?"}</span>`;
  }).join("")}</div>`;
}
function cubes(p) {
  const parts = p.parts.map(id => P[id]).filter(Boolean);
  return `<div class="tag">из слов</div><div class="cubes">${parts.map((w, i) =>
    `${i ? '<span class="cube plus">+</span>' : ""}<span class="cube"><div class="zw">${w.zh}</div><div class="ps">${displaySay(w.say)}</div><div class="pr">${esc(w.ru)}</div></span>`
  ).join("")}</div>`;
}
function sylBlock(id) {
  const p = P[id]; if (!p) return "";
  const x = SYL[id] || autoSyl(p);
  if (!x) return "";
  const rows = x.steps.map(s => `<li><b>${esc(s.s)}</b> — голос ${esc(s.go)}${s.how ? ". " + esc(s.how) : ""}</li>`).join("");
  return `<details class="syl"><summary>по слогам</summary><div class="box"><ol>${rows}</ol><p class="small" style="margin:.5rem 0 0">${esc(x.end)} Каждый слог — свой удар, русского ударения нет.</p></div></details>`;
}
function memoBlock(p) {
  if (!p.memo) return "";
  return `<div class="memo"><div class="hook">чтобы запомнить</div>${esc(p.memo)}</div>`;
}
function imgBlock(p) { return p.img ? `<img src="${p.img}" alt="" loading="lazy">` : ""; }
function face(id, opts) {
  const p = P[id]; const o = opts || {};
  const isW = p.kind === "w";
  const tag = isW ? (p.screen ? (PLACES.has(id) ? "место · на экран" : "фраза · на экран") : "слово") : "фраза";
  return `<div class="tag">${tag}</div>
    <div class="zh">${p.zh}</div>
    <div class="say">${displaySay(p.say)}</div>
    <div class="ru">${esc(p.ru)}</div>
    <div class="py">${esc(p.py)}</div>
    ${isW ? charsLine(p.zh) : cubes(p)}
    ${p.note ? `<p class="small muted" style="margin:.4rem 0 0">${esc(p.note)}</p>` : ""}
    ${p.screen ? `<div class="screen">${PLACES.has(id) ? "Это имя показывают экраном. Произношение — запас." : "Показывайте экраном: нажмите «показать». Выговаривать не обязательно."}</div>` : ""}
    ${sylBlock(id)}
    ${isW && !o.noMemo ? memoBlock(p) : ""}
    ${isW && !o.noImg ? imgBlock(p) : ""}`;
}
function itemButtons(id) {
  const p = P[id];
  return `<span class="btns">
    <button class="btn" data-play="${id}">слушать</button>
    <button class="btn rec" data-rec="${id}" data-expect="${esc(p.zh)}">сказать</button>
    <button class="btn soft" data-show="${id}">показать</button>
  </span>`;
}
function itemCard(id) {
  const p = P[id]; if (!p) return "";
  return `<article class="item" id="it-${id}">
    <div class="head"><div></div>${itemButtons(id)}</div>
    ${face(id)}
    <div data-chk="${id}">${takeInner(id)}</div>
  </article>`;
}
function list(ids) { return ids.map(itemCard).join(""); }

// ---------- запись и проверка ----------
const TAKES = {};
let recBusy = false, recListen = false, recId = "", recStream = null, recRec = null, recSr = null, recTimer = null;
function phraseByZh(zh) {
  const key = stripZh(zh); if (!key) return null;
  for (const id of Object.keys(P)) if (stripZh(P[id].zh) === key) return P[id];
  return null;
}
function segment(zh) {
  const s = stripZh(zh); const out = []; let i = 0;
  while (i < s.length) {
    let hit = null;
    for (let L = Math.min(5, s.length - i); L >= 1; L--) {
      const seg = s.slice(i, i + L);
      if (LEX[seg]) { hit = [seg, LEX[seg][0], LEX[seg][1]]; break; }
    }
    if (!hit) hit = [s[i], "?", "?"];
    out.push(hit); i += hit[0].length;
  }
  return out;
}
function readParts(zh) {
  const segs = segment(zh);
  return { say: segs.map(x => x[1]).join(" "), ru: segs.map(x => x[2]).join(" · ") };
}
function showZh(zh, id) {
  const clean = stripZh(zh);
  const hit = phraseByZh(clean) || (id && P[id] && stripZh(P[id].zh) === clean ? P[id] : null);
  if (hit) return { zh: hit.zh, say: displaySay(hit.say), ru: hit.ru };
  const parts = readParts(clean);
  return { zh, say: parts.say, ru: parts.ru };
}
function lineZh(x) { return (!x || !x.zh) ? "" : `<span class="zh" style="font-size:1.3rem">${esc(x.zh)}</span><br><b>${esc(x.say)}</b><br>${esc(x.ru)}`; }
function scoreHeard(id, heard, expect) {
  const want = stripZh(expect), got = stripZh(heard);
  const pack = (ok, title, extra) => ({ ok, title, extra: extra || "", heard: showZh(heard, null), need: showZh(expect, id) });
  if (!got) return { ok:"no", title:"не расслышал", extra:"ближе к микрофону" };
  if (got === want || (ALIAS[id] || []).some(a => stripZh(a) === got)) return pack("yes", "похоже, узнают");
  if (want && (got.includes(want) || want.includes(got))) return pack("mid", "часть есть", "скажите целиком");
  const set = new Set([...want]); const hit = [...got].filter(c => set.has(c)).length;
  if (want.length && hit >= Math.ceil(want.length * 0.6)) return pack("mid", "почти");
  if (id && /^ma[1-4]$/.test(id)) {
    const map = {妈:"1",麻:"2",马:"3",骂:"4"}; const tone = map[got[0]];
    if (tone) return pack("no", "другой тон", "услышал тон " + tone + ". Нужен другой.");
  }
  return pack("no", "не то");
}
function takeInner(id) {
  if (recBusy && recId === id) return `<div class="check wait"><b>${recListen ? "слушаю — говорите" : "микрофон…"}</b><p>фраза целиком, потом секунда тишины</p></div>`;
  const t = TAKES[id]; if (!t) return "";
  const extra = t.extra ? `<p>${esc(t.extra)}</p>` : "";
  const heard = t.heard ? `<p class="cmp"><span class="muted">услышал</span><br>${lineZh(t.heard)}</p>` : "";
  const need = t.need ? `<p class="cmp"><span class="muted">надо</span><br>${lineZh(t.need)}</p>` : (t.detail ? `<p>${esc(t.detail)}</p>` : "");
  return `<div class="check ${t.ok}"><b>${esc(t.title)}</b>${extra}${heard}${need}${t.url ? `<p><button class="btn" data-mine="${id}">моя запись</button></p>` : ""}</div>`;
}
function paintChk(id) {
  document.querySelectorAll('[data-chk="'+id+'"]').forEach(el => { el.innerHTML = takeInner(id); });
  document.querySelectorAll('button[data-rec="'+id+'"]').forEach(b => b.classList.toggle("on", recBusy && recId === id));
}
function stopRec() {
  if (recTimer) { clearTimeout(recTimer); recTimer = null; }
  if (recSr) { try { recSr.stop(); } catch (e) {} recSr = null; }
  if (recRec && recRec.state === "recording") { try { recRec.stop(); } catch (e) {} }
  if (recStream) { recStream.getTracks().forEach(t => t.stop()); recStream = null; }
  recListen = false;
}
function startRec(id, expect) {
  if (recBusy && recId === id) { recBusy = false; stopRec(); paintChk(id); return; }
  if (recBusy) { const prev = recId; recBusy = false; stopRec(); paintChk(prev); }
  if (window.speechSynthesis) try { speechSynthesis.cancel(); } catch (e) {}
  if (player) { try { player.pause(); } catch (e) {} }
  recId = id; recBusy = true; recListen = false; paintChk(id);
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  let closed = false, heard = "", clip = "", peak = 0, meterIv = null;
  const spoke = () => peak > 0.04;
  const finish = () => {
    if (closed) { if (clip && TAKES[id]) { TAKES[id].url = clip; paintChk(id); } return; }
    closed = true; recBusy = false; recListen = false;
    if (meterIv) { clearInterval(meterIv); meterIv = null; }
    stopRec();
    if (heard) TAKES[id] = Object.assign(scoreHeard(id, heard, expect), { url: clip });
    else if (clip || spoke()) TAKES[id] = { ok:"ear", title:"запись есть, разбор не вышел",
      detail: isSafari ? "Safari плохо слышит китайский. Нажмите «моя запись» и сравните с образцом. Автопроверка — в Chrome." : "Голос записался. Браузер не понял иероглифы. Сравните свою запись с «слушать».", url: clip };
    else TAKES[id] = { ok:"no", title:"в микрофон тишина", detail:"разрешите микрофон и говорите после строки «слушаю — говорите».", url: clip };
    paintChk(id);
  };
  const startSr = () => {
    if (!SR) { recListen = true; paintChk(id); return; }
    recSr = new SR(); recSr.lang = "zh-CN"; recSr.interimResults = true; recSr.maxAlternatives = 5; recSr.continuous = !isIOS;

const DIG = ["零","一","二","三","四","五","六","七","八","九"];
function numZh(n, count) {
  n = Math.floor(Math.abs(n)); if (n === 0) return "零";
  if (n >= 10000) return String(n);
  let s = "";
  const q = Math.floor(n / 1000), b = Math.floor(n % 1000 / 100), t = Math.floor(n % 100 / 10), o = n % 10;
  if (q) s += DIG[q] + "千";

  if (t) s += (t === 1 && !q && !b ? "" : DIG[t]) + "十"; else if ((q || b) && o) s += "零";
  if (o) s += DIG[o];

  return s;
}
function sayZh(zh) { return segment(zh).map(x => x[1]).join("-"); }
const NUMCH = {零:0,〇:0,一:1,二:2,两:2,三:3,四:4,五:5,六:6,七:7,八:8,九:9};
const NUMU = {十:10,百:100,千:1000,万:10000};

  let total = 0, section = 0, num = 0, any = false, lastUnit = 0;
  for (const ch of s) {
    if (ch in NUMCH) { num = NUMCH[ch]; any = true; }
    else if (ch in NUMU) {

      if (u === 10000) { section = (section + num) * u; total += section; section = 0; num = 0; }
      else { if (num === 0 && u === 10 && section === 0) num = 1; section += num * u; num = 0; lastUnit = u; }
    } else return null;

}

    </div>
    ${sound("nv","女","нюй (ü)","«И», губы как на «ю». qu = цюй, xu = сюй.","s-nv")}
    ${sound("hao","好","хао","Горловое х. Рот: а → о. Не «хэй».","s-hao")}
    ${sound("wo","我","во","Губы сразу на «о». Не «ва».","s-wo")}
    <div class="card">
      <h2>Как складывается фраза</h2>
      <p>Кто → делает → что / куда. Глагол не спрягается, падежей нет. Новую фразу собираете из старых кубиков.</p>
      <p><b>我要这个</b> — я + хочу + это. <b>我要去…</b> — я + хочу + ехать + место. <b>洗手间在哪里</b> — вещь + находится + где.</p>
      <p><b>不</b> перед глаголом: 不要, 听不懂. <b>吗</b> в конце делает вопрос, слова не переставляете. <b>了</b> — уже случилось: 太贵了.</p>
    </div>
    <div class="card">
      <h2>Голос не идёт «сначала низко, потом высоко»</h2>
      <p>Каждый слог — свой тон. В 我要这个 четыре разных движения, не лестница вверх. Вопрос не обязан подниматься в конце: тот же ряд + ленивое 吗.</p>
      <p>Ломается только стык: 你好 — первый слог вверх, 不要 — 不 вверх. Слушайте удары, не общий подъём.</p>
    </div>
    <div class="card">
      <h2>На телефон</h2>
      <p class="small">Откройте эту ссылку в Safari на iPhone → кнопка «Поделиться» → <b>«На экран Домой»</b>. Появится значок как у приложения, страница откроется и без интернета после первого захода. На Android в Chrome: меню → «Добавить на главный экран».</p>
      <p class="small">В Китае без VPN не работают Google и часть сети. Всё, что здесь: картинки, звук, разговорник, конструктор, цифры — скачивается в телефон заранее. Перевод произвольной речи и слух в Chrome — нет; слух в Safari на iPhone — да.</p>
      <p class="small muted offline-st"></p>
    </div>`;
  offlineStatus();
}

// ---------- вкладки и события ----------
const TABS = ["today","cal","book","live","cards","how"];
function showTab(name) {
  document.querySelectorAll("nav.tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === name));
  TABS.forEach(id => $("#tab-"+id).classList.toggle("hidden", id !== name));
  if (name === "book") renderBook();
  if (name === "live") renderLive();
  if (name === "cards") renderCards();
  window.scrollTo({ top: 0 });
  try { sessionStorage.setItem("zh-tab", name); } catch (e) {}
}

document.body.addEventListener("click", (e) => {
  const t = e.target.closest("button, .brow, .show") || e.target;
  const d = t.dataset || {};
  if (d.tab) { showTab(d.tab); return; }
  if (d.open) { setDay(d.open); showTab("today"); return; }
  if (d.play) { playId(d.play); return; }
  if (d.playzh) { playZh(d.playzh); return; }
  if (d.snd) { playFile(d.snd); return; }
  if (d.rec) { startRec(d.rec, d.expect || (P[d.rec] && P[d.rec].zh) || ""); return; }
  if (d.mine) { playMine(d.mine); return; }
  if (d.show) { showId(d.show); return; }
  if (d.showb) { const b = builtById(d.showb); if (b) showBig(b.zh, b.say, b.ru, "", { playId: b.id }); return; }
  if (d.showzh) { const r = readParts(d.showzh); showBig(d.showzh, r.say, d.showru || r.ru, "", { noAnswers: !!d.showru }); return; }
  if (d.ans) { const p = P[d.ans]; document.querySelectorAll(".show .ans button").forEach(b => b.classList.toggle("on", b === t)); const g = $("#got"); if (g && p) g.textContent = "Ответ: " + p.ru + " — " + p.zh + " " + displaySay(p.say); playId(d.ans); return; }
  if (d.close) { closeShow(); return; }
  if (d.frame || d.word) {
    if (d.frame) bFrame = d.frame; else bWord = d.word;
    const body = $("#book-body"); if (body) body.innerHTML = bookBody();
    const on = document.querySelector(".frames button.on"); if (on) on.scrollIntoView({ inline: "center", block: "nearest" });
    if (d.word) playId("b-" + bFrame + "-" + bWord);
    return;
  }
  if (d.dismiss) { try { localStorage.setItem("zh-" + d.dismiss, "1"); } catch (er) {} const c = t.closest(".card"); if (c) c.remove(); return; }
  if (d.cat) { bookCat = d.cat; bookQ = ""; bookOpen = ""; try { localStorage.setItem("zh-cat", bookCat); } catch (er) {} renderBook(); return; }
  if (d.bookClear) { bookQ = ""; renderBook(); return; }
  if (d.openRow !== undefined && !e.target.closest("button, details, summary, input")) { bookOpen = bookOpen === d.openRow ? "" : d.openRow; renderBook(); const el = document.querySelector(`[data-open-row="${bookOpen}"]`); if (el) el.scrollIntoView({ block: "nearest", behavior: "smooth" }); return; }
  if (d.live === "zh") { if (liveMode === "zh" && liveSr) { try { liveSr.stop(); } catch (er) {} return; } liveHearZh(); return; }
  if (d.live === "ru") { if (liveMode === "ru" && liveSr) { try { liveSr.stop(); } catch (er) {} return; } liveHearRu(); return; }
  if (d.live === "clear") { LIVE.hist = []; saveHist(); renderLive(); return; }
  if (d.deck) { buildDeck(d.deck); renderCards(); showTab("cards"); return; }
  if (d.grade) { grade(d.gid, d.grade === "yes"); cardI = (cardI + 1) % deck.length; revealed = false; if (deckKind === "due" && d.grade === "yes") { deck.splice(cardI ? cardI - 1 : deck.length - 1, 1); if (!deck.length) buildDeck("today"); else cardI = cardI % deck.length; } renderCards(); return; }
  if (d.game === "play") { gamePlay(false); return; }
  if (d.game === "again") { gamePlay(true); return; }
  if (d.game === "reveal") { gameOpen = true; const g = $("#game"); if (g) g.outerHTML = priceGame(); const g2 = $("#game-today"); if (g2) g2.outerHTML = priceGame().replace('id="game"', 'id="game-today"'); return; }
  if (t.id === "play-all") { playIds(day.ids); return; }
  if (t.id === "flip") { if (!revealed) { revealed = true; renderCards(); playId(deck[cardI]); } else playId(deck[cardI]); return; }
  if (t.id === "next") { cardI = (cardI+1) % deck.length; revealed = false; renderCards(); return; }
  if (t.id === "prev") { cardI = (cardI-1+deck.length) % deck.length; revealed = false; renderCards(); return; }
});
document.body.addEventListener("submit", (e) => {
  if (e.target.dataset.bookForm) { e.preventDefault(); bookQ = $("#book-q").value; bookOpen = ""; renderBook(); const q = $("#book-q"); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }
  if (e.target.dataset.liveForm) { e.preventDefault(); const v = $("#live-in").value.trim(); if (v) liveSayRu(v); }
  if (e.target.dataset.pasteForm) { e.preventDefault(); livePasteZh($("#paste-in").value); }
});
document.body.addEventListener("input", (e) => {
  if (e.target.id === "book-q") { bookQ = e.target.value; bookOpen = ""; renderBookList(); }
  if (e.target.id === "num-in") { bookNum = e.target.value; const c = e.target.closest(".conv"); if (c) { c.outerHTML = convBlock(); const i = $("#num-in"); if (i) { i.focus(); } } }
});
function renderBookList() {
  // перерисовать только тело, чтобы не терять фокус в поиске
  const tab = $("#tab-book");
  tab.querySelectorAll(".chips button").forEach(b => b.classList.toggle("on", !bookQ && b.dataset.cat === bookCat));
  const clr = tab.querySelector("[data-book-clear]");
  if (bookQ && !clr) tab.querySelector("form").insertAdjacentHTML("beforeend", `<button class="btn" type="button" data-book-clear="1">×</button>`);
  if (!bookQ && clr) clr.remove();
  const body = $("#book-body"); if (body) body.innerHTML = bookBody();
}
document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeShow(); });

// ---------- старт ----------
if (SW_ON) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
  navigator.serviceWorker.addEventListener("message", (ev) => { if (ev.data && ev.data.type === "precache") offlineStatus(); });
}
setDay(isoToday());
renderHow();
paintDue();
const savedTab = (() => { try { return sessionStorage.getItem("zh-tab"); } catch (e) { return ""; } })();
showTab(TABS.includes(savedTab) ? savedTab : "today");
</script>
