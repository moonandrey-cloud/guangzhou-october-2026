<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Китайский до Гуанчжоу</title>
  <style>
    :root {
      --bg: #f4f1ea;
      --ink: #1a1714;
      --muted: #5c564c;
      --card: #fffdf8;
      --line: #e4ddd2;
      --accent: #9a3b2f;
      --memo: #f7efe3;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 16px/1.45 system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    header, main { max-width: 42rem; margin: 0 auto; padding: 1rem 1rem 2.5rem; }
    header h1 { font-size: 1.35rem; margin: 0 0 .25rem; }
    header p { margin: 0; color: var(--muted); }
    .parts { display: flex; flex-wrap: wrap; gap: .5rem; margin: .45rem 0 .2rem; }
    .part {
      background: var(--memo);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: .4rem .65rem;
      min-width: 4.8rem;
    }
    .part .zw { font-size: 1.2rem; }
    .part .ps { font-weight: 650; }
    .part .pr { color: var(--muted); font-size: .9rem; }
    .assemble { margin: .35rem 0; }
    .tag { font-size: .8rem; color: var(--muted); }
    nav { display: flex; gap: .4rem; flex-wrap: wrap; margin: 1rem 0; }
    nav button, .btn {
      border: 1px solid var(--line);
      background: var(--card);
      color: var(--ink);
      border-radius: 999px;
      padding: .45rem .85rem;
      min-height: 44px;
      font: inherit;
    }
    nav button.on, .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .card, .phrase {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 1rem;
      margin: .75rem 0;
    }
    h2 { font-size: 1.1rem; margin: 1.25rem 0 .4rem; }
    .row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; justify-content: space-between; }
    .flash { min-height: 10rem; display: flex; flex-direction: column; justify-content: center; gap: .45rem; }
    .flash .big { font-size: 1.7rem; }
    .say { font-size: 1.25rem; font-weight: 600; }
    .zh { font-size: 1.35rem; }
    .chars {
      display: flex;
      flex-wrap: wrap;
      gap: .35rem .85rem;
      color: var(--muted);
      margin-top: .2rem;
    }
    .ch { white-space: nowrap; }
    .ch b { color: var(--ink); font-weight: 650; }
    .py { color: var(--muted); font-size: .85rem; }
    select, .btn { cursor: pointer; }
    select { min-height: 44px; font: inherit; padding: .4rem .6rem; max-width: 100%; }
    .muted { color: var(--muted); }
    .hidden { display: none; }
    .day {
      display: block;
      width: 100%;
      text-align: left;
      border-radius: 10px;
      margin: .4rem 0;
      padding: .75rem .9rem;
      min-height: 52px;
    }
    .day .when { font-weight: 650; }
    .day .what { margin-top: .15rem; }
    .day.now { background: var(--accent); color: #fff; border-color: var(--accent); }
    .day.past { color: var(--muted); }
    .banner { font-size: 1.05rem; }
    .memo {
      background: var(--memo);
      border-left: 3px solid var(--accent);
      padding: .65rem .8rem;
      margin-top: .65rem;
      border-radius: 0 8px 8px 0;
    }
    .memo .hook { font-weight: 650; margin-bottom: .25rem; }
    .phrase img, .flash img {
      width: 100%;
      border-radius: 8px;
      margin-top: .65rem;
      display: block;
    }
    .mouth { margin-top: .55rem; }
    .syl { margin-top: .65rem; padding: .65rem .8rem; background: #eef2ea; border-radius: 8px; }
    .syl ol { margin: .35rem 0 0; padding-left: 1.2rem; }
    .syl li { margin: .35rem 0; }
    .syl .end { margin: .55rem 0 0; }
    .btns { display: flex; gap: .4rem; flex-wrap: wrap; }
    .btn.on { background: var(--accent); color: #fff; border-color: var(--accent); }
    .check { margin-top: .65rem; padding: .65rem .8rem; border-radius: 8px; }
    .check p { margin: .35rem 0 0; }
    .check.yes { background: #e7efe4; }
    .check.mid { background: #f7f0d8; }
    .check.no { background: #f6e4e0; }
    .check.wait { background: var(--memo); }
    .check.ear { background: #e8eef4; }
    .check .cmp { margin-top: .55rem; }
    .tones { width: 100%; height: 90px; margin: .5rem 0; }
  </style>
</head>
<body>
  <header>
    <h1>Китайский до Гуанчжоу</h1>
    <p>Сначала слово. Потом фраза из этих слов. Картинка — на слово, не на всю скороговорку.</p>
  </header>
  <main>
    <p id="today" class="banner"></p>
    <nav>
      <button data-tab="today" class="on">Сегодня</button>
      <button data-tab="cal">Даты</button>
      <button data-tab="how">Как говорить</button>
      <button data-tab="cards">Карточки</button>
      <button data-tab="book">Разговорник</button>
      <button data-tab="china">В Китае</button>
    </nav>
    <section id="tab-today"></section>
    <section id="tab-cal" class="hidden"></section>
    <section id="tab-how" class="hidden"></section>
    <section id="tab-cards" class="hidden"></section>
    <section id="tab-book" class="hidden"></section>
    <section id="tab-china" class="hidden"></section>
  </main>

function ttsUrl(zh) {
  const text = (zh || "").replace(/[…。？！?]/g, "");
  return "say?text=" + encodeURIComponent(text);
}
function markBtn(sel, on) {
  document.querySelectorAll(sel).forEach(b => b.classList.toggle("on", on));
}
function speak(zh) {
  if (!window.speechSynthesis) return;
  const text = (zh || "").replace(/[…]/g, "");
  const go = () => {
    try { speechSynthesis.cancel(); } catch (e) {}
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "zh-CN";
    u.rate = 0.8;
    const voices = speechSynthesis.getVoices() || [];
    const v = voices.find(x => /zh-CN/i.test(x.lang)) || voices.find(x => /zh|Chinese|Ting/i.test(x.lang + x.name));
    if (v) u.voice = v;
    setTimeout(() => {
      try { speechSynthesis.resume(); } catch (e) {}
      speechSynthesis.speak(u);
    }, 60);
  };
  if (!(speechSynthesis.getVoices() || []).length) {
    speechSynthesis.addEventListener("voiceschanged", go, { once: true });
  }
  go();
}
function playSrc(src, onFail, onEnd) {
  if (player) { player.pause(); player.onended = null; }
  player = new Audio(src);
  player.onended = () => { if (onEnd) onEnd(); };
  player.onerror = () => { if (onFail) onFail(); };
  const p = player.play();
  if (p && p.catch) p.catch(() => { if (onFail) onFail(); });
}
function playId(id) {
  const p = P[id];
  if (!p) return;
  markBtn('button[data-id="'+id+'"]', true);
  const done = () => markBtn('button[data-id="'+id+'"]', false);
  const viaSpeak = () => { speak(p.zh); setTimeout(done, 1800); };
  const viaTts = () => playSrc(ttsUrl(p.zh), viaSpeak, done);
  if (AUDIO[id]) playSrc(AUDIO[id], viaTts, done);
  else viaTts();
}
function playIds(ids) {
  let i = 0;
  const next = () => {
    if (i >= ids.length) return;
    playId(ids[i++]);
    if (player) player.addEventListener("ended", () => setTimeout(next, 350), { once: true });
    else setTimeout(next, 2200);
  };
  next();
}

function phraseByZh(zh) {

}
function readParts(zh) {

  for (const ch of chars) {
    const row = READ[ch];
    if (row) { say.push(row[0]); ru.push(row[1]); }
    else { say.push(ch); ru.push("?"); }
  }
  return { say: say.join("-"), ru: ru.join(" · ") };
}

  }).join("");

function stopRec() {

function startRec(id, expect) {

  if (recBusy) { const prev = recId; recBusy = false; stopRec(); paintChk(prev); }

  recListen = false;

  let closed = false;
  let heard = "";
  let clip = "";
  let peak = 0;
  let meterIv = null;
  const spoke = () => peak > 0.04;
  const finish = () => {
    if (closed) {
      if (clip && TAKES[id]) { TAKES[id].url = clip; paintChk(id); }
      return;
    }
    closed = true;
    recBusy = false;
    recListen = false;
    if (meterIv) { clearInterval(meterIv); meterIv = null; }
    stopRec();
    if (heard) {
      TAKES[id] = Object.assign(scoreHeard(id, heard, expect), { url: clip });
    } else if (clip || spoke()) {
      TAKES[id] = {
        ok: "ear",
        title: "запись есть, разбор не вышел",
        detail: isSafari
          ? "Сафари плохо слышит китайский. Нажмите «моя запись» и сравните с образцом. Автопроверка — в Chrome."
          : "Голос записался. Браузер не понял иероглифы. Сравните свою запись с «слушать».",
        url: clip
      };
    } else {
      TAKES[id] = {
        ok: "no",
        title: "в микрофон тишина",
        detail: "разрешите микрофон в адресной строке и говорите после строки «слушаю — говорите».",
        url: clip
      };

  };

    if (!SR) { recListen = true; paintChk(id); return; }
    recSr = new SR();
    recSr.lang = "zh-CN";
    recSr.interimResults = true;
    recSr.maxAlternatives = 5;
    recSr.continuous = true;
    recSr.onstart = () => { recListen = true; paintChk(id); };
    recSr.onresult = (ev) => {
      let best = "";
      for (let i = 0; i < ev.results.length; i++) best += ev.results[i][0].transcript || "";
      if (best) heard = best;
      const got = stripZh(heard);
      const want = stripZh(expect);
      if (want && got && (got === want || (ALIAS[id] || []).some(a => stripZh(a) === got))) finish();
    };

        paintChk(id);

  };

    if (recSr) { try { recSr.stop(); } catch (e) {} }

    setTimeout(finish, 700);

      if (closed) { stream.getTracks().forEach(t => t.stop()); return; }
      recStream = stream;
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const src = ctx.createMediaStreamSource(stream);
        const analyser = ctx.createAnalyser();
        analyser.fftSize = 512;
        src.connect(analyser);
        const buf = new Uint8Array(analyser.fftSize);

        fileStream.getTracks().forEach(t => t.stop());

        if (TAKES[id]) { TAKES[id].url = clip; paintChk(id); }

function schedule() {

    ...CHINA.map(d => ({ iso: d.iso, title: d.title, ids: d.ids, note: d.task, kind: "china" }))

function nextAfter(iso) { return schedule().find(d => d.iso > iso); }
function dayFor(iso) {
  const exact = schedule().find(d => d.iso === iso);

  if (iso < "2026-09-05") return { ...schedule()[0], mode: "before" };
  if (iso > "2026-11-03") return { ...schedule()[schedule().length-1], mode: "after" };

}

  todayIds.forEach(id => {
    const p = P[id];
    if (p && !AUDIO[id]) { const a = new Audio(ttsUrl(p.zh)); a.preload = "auto"; }
  });
}
function playFile(key) {
  const src = AUDIO[key];
  if (!src) return;
  if (player) { player.pause(); player.onended = null; }
  player = new Audio(src);
  player.play();
}

setDay(isoToday());
renderHow();

const cats = {
  all: Object.keys(P),
  greet:["nihao","xiexie","duibuqi","haode"],
  stop:["tbd","slow","eng","ru"],
  food:["woyao","caidan","mifan","shui","buyaola","maidan","wc","cha","pijiu","pijiuyu"],
  train:["gaotie","ditie","zhan","piao","chukou","gzs"],
  place:["woqu","gz","gzs","yangshuo","xingping","zjj","zjjx","libo","baiyun"]
};
document.getElementById("tab-book").innerHTML = `
  <p class="muted">Крупная строка — как сказать. Ниже — крючок, чтобы слово само всплыло.</p>
  <p><select id="cat">
    <option value="all">все</option>
    <option value="greet">рот</option>
    <option value="stop">стоп-кран</option>
    <option value="food">еда</option>
    <option value="train">поезд</option>
    <option value="place">места</option>
  </select></p>
  <div id="book-table">${list(cats.all)}</div>`;

document.getElementById("tab-china").innerHTML = `
  <p class="muted">Полевые дни уже под ваш график: Гонконг, стенд, Шэньчжэнь, потом горы. Не учить новое. 10 минут в номере.</p>
  ${CHINA.map(d => `<div class="card"><strong>${fmt(d.iso)} · ${d.title}</strong><p>${d.task}</p></div>${list(d.ids)}`).join("")}`;

document.body.addEventListener("click", (e) => {
  const t = e.target.closest("button") || e.target;
  if (t.dataset.tab) {
    document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === t.dataset.tab));
    ["today","cal","how","cards","book","china"].forEach(id => {
      document.getElementById("tab-"+id).classList.toggle("hidden", id !== t.dataset.tab);
    });
  }
  if (t.dataset.open) {
    setDay(t.dataset.open);
    document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === "today"));
    ["today","cal","how","cards","book","china"].forEach(id => {
      document.getElementById("tab-"+id).classList.toggle("hidden", id !== "today");
    });
  }
  if (t.dataset.id) playId(t.dataset.id);
  if (t.dataset.snd) playFile(t.dataset.snd);
  if (t.dataset.rec) startRec(t.dataset.rec, t.dataset.expect || (P[t.dataset.rec] && P[t.dataset.rec].zh) || "");
  if (t.dataset.mine) playMine(t.dataset.mine);
  if (t.id === "play-all") playIds(todayIds);
  if (t.id === "flip") {
    if (!revealed) { revealed = true; renderCard(); }
    else playId(cardIds[cardI]);
  }
  if (t.id === "next") { cardI = (cardI+1)%cardIds.length; revealed=false; renderCard(); }
  if (t.id === "prev") { cardI = (cardI-1+cardIds.length)%cardIds.length; revealed=false; renderCard(); }
});
document.getElementById("cat").addEventListener("change", (e) => {
  document.getElementById("book-table").innerHTML = list(cats[e.target.value]);
});
</script>
</body>
</html>
